# Single source of truth for every dependency version in this repo.
#
# Every app MUST reference deps as "catalog:" — never a literal version, never a range.
# This is not style. Unequal transitive dependency versions between two apps would make
# the byte comparison between them meaningless, and the whole point of this repo is that
# the byte comparison is trustworthy. pnpm enforces it; reviewers don't have to.

packages:
  - 'packages/*'
  - 'stacks/*/*'
  - 'spike/*/*'

allowBuilds:
  simple-git-hooks: true
  # Svelte spike. Neither postinstall is needed to build: @parcel/watcher is svelte-loader's
  # optional native watcher (nothing here watches) and svelte-preprocess's is optional too.
  # Declared rather than approved interactively, so CI and a laptop agree.
  '@parcel/watcher': false
  svelte-preprocess: false

catalog:
  # ---- Measurement ----
  # The library RUM actually uses, so the bench reports Core Web Vitals the same way the
  # field does rather than a hand-rolled approximation of it. v6 is the first release that
  # understands soft navigations (docs/constraints.md §14).
  web-vitals: 6.1.1
  axe-core: 4.10.3
  # Pure Node, programmatic, low overhead — the right tool for comparing server configs
  # rather than for scripting user journeys.
  autocannon: 8.0.0

  # ---- Module Federation (pinned to 2.8.2 release train) ----
  '@module-federation/enhanced': 2.8.2
  '@module-federation/rsbuild-plugin': 2.8.2
  '@module-federation/runtime': 2.8.2
  '@module-federation/bridge-react': 2.8.2
  '@module-federation/node': 2.7.49 # trails the train; latest published
  '@module-federation/vite': 1.20.7
  '@module-federation/sdk': 2.8.2 # churns weekly — bump deliberately, see docs/constraints.md

  # ---- Bundlers ----
  '@rsbuild/core': 2.1.13
  '@rsbuild/plugin-react': 2.1.0
  '@rsbuild/plugin-sass': 2.0.1

  # ---- Svelte spike (spike/rspack-svelte) ----
  # Is Module Federation possible with Svelte at all? Everything published on the question is
  # a blog post or a broken demo, so this repo answers it the way it answers everything else.
  svelte: 5.56.10
  svelte-loader: 3.2.4
  svelte-check: 4.3.5
  '@rsbuild/plugin-svelte': 2.0.1
  # vite 8.1.0 / plugin-react 5.1.4 deliberately match what @module-federation/vite's own
  # example suite is tested against — NOT npm latest (8.2.2 / 6.1.0). Tested beats newest.
  vite: 8.1.0
  '@vitejs/plugin-react': 5.1.4

  # ---- Framework ----
  react: 19.2.8
  react-dom: 19.2.8

  # ---- SSR server ----
  hono: 4.13.3
  '@hono/node-server': 2.1.1

  # ---- Design system ----
  tailwindcss: 4.3.3
  '@rsbuild/plugin-tailwindcss': 2.0.3

  # ---- Lint / test / stories ----
  eslint: 10.9.0
  '@eslint/js': 10.0.1
  typescript-eslint: 8.67.0
  '@typescript-eslint/parser': 8.67.0
  eslint-plugin-jsx-a11y: 6.10.2
  eslint-plugin-testing-library: 7.16.2
  vitest: 4.1.11
  '@vitest/coverage-v8': 4.1.11
  jsdom: 30.0.1
  '@testing-library/react': 16.3.2
  '@testing-library/user-event': 14.6.6
  '@testing-library/jest-dom': 7.0.1
  storybook: 10.5.10
  storybook-react-rsbuild: 3.4.2
  '@storybook/addon-a11y': 10.5.10
  '@axe-core/playwright': 4.13.0
  knip: 6.32.2
  lint-staged: 17.3.0

  # ---- Tooling ----
  # typescript 5.9.3, not 7.0.2 latest: TS7 is the native rewrite, too new for the
  # plugin ecosystem we depend on. 5.9.3 is what MF's own examples use.
  typescript: 5.9.3
  '@playwright/test': 1.62.1
  playwright: 1.62.1
  '@types/node': 26.2.0
  '@types/react': 19.2.18
  '@types/react-dom': 19.2.4

# Build scripts we have reviewed and allow to run on install.
onlyBuiltDependencies:
  - '@rspack/binding'
  - core-js
  - esbuild
