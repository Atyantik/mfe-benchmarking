# The measurement gate. Slower than `check` and needs a browser, the media fixtures and the
# whole stack running, so it is separate — but it is not optional: every architectural claim
# in this repo is asserted by one of these suites.
name: bench

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: bench-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium

      # The fixtures come from a release asset, NOT from Wikimedia.
      #
      # `pnpm media` fetches seventeen photographs from Commons, which is right for a
      # developer setting up once and wrong for CI: shared runner IP ranges are rate-limited
      # hard enough that a cold fetch reliably exceeded eight minutes and then failed. A
      # benchmark should not depend on a third party being in a good mood.
      #
      # The asset is built by `pnpm media` and published deliberately; `sources.json` plus
      # `scripts/derive.mjs` reproduce it byte for byte.
      - name: Restore media fixtures
        run: |
          gh release download media-fixtures-v1 \
            --pattern 'media-fixtures.tar.gz' --output /tmp/media-fixtures.tar.gz
          tar -xzf /tmp/media-fixtures.tar.gz -C packages/media
          test -f packages/media/manifest.json
          echo "restored $(find packages/media/dist -type f | wc -l) fixture files"
        env:
          GH_TOKEN: ${{ github.token }}
      - run: pnpm build
      - run: pnpm dev
      - run: pnpm bench

      - if: always()
        run: node scripts/stack.mjs stop

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-results
          path: results/
